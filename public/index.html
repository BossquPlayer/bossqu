<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bossqu Media Player</title>
  <link rel="icon" type="image/png" href="logo-bossqu.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo-container">
    <img src="image/bossqulogo.jpg" alt="Bossqu Media Player Logo" class="logo-large">
    <h1>Bossqu Media Player</h1>
  </div>
</header>

<div class="container">
  <!-- Playlist kiri -->
  <aside class="playlist">
    <h2>Playlist</h2>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('audio', event)">Audio</button>
      <button class="tab-btn" onclick="showTab('video', event)">Video</button>
    </div>
    <div id="playlist-audio" class="playlist-tab show"></div>
    <div id="playlist-video" class="playlist-tab"></div>
  </aside>

  <!-- Player tengah -->
  <main class="player">
    <h2>Media Player</h2>
    <div class="player-box">
      <video id="player" controls muted height="300"></video>
      <div id="liveIndicator" style="display:none;">LIVE</div>
      <div id="audioPlaceholder" class="audio-placeholder" style="display:none;">🎵 Audio Sedang Diputar</div>
    </div>

    <div id="infoLagu" class="info">Tidak ada media diputar</div>
    <p id="durasi">00:00 / 00:00</p>


<!-- Baris 1: tombol utama -->
<div class="player-controls-main">
  <button class="play-all-btn" onclick="playAll()" title="Play All">▶️</button>
  <button class="stop-btn" onclick="stopPlayer()" title="Stop">⏹</button>
</div>

<!-- Baris 2: tombol tambahan -->
<div class="player-controls-extra">
  <button class="repeat-btn" onclick="toggleRepeat()" title="Repeat Playlist">🔁</button>
  <button class="shuffle-btn" onclick="shufflePlaylist()" title="Shuffle">🔀</button>
  <button class="repeat-single-btn" onclick="toggleRepeatSingle()" title="Repeat Single Track">🔂</button>
  <button class="prev-btn" onclick="prevTrack()" title="Previous Track">⏮</button>
  <button class="next-btn" onclick="nextTrack()" title="Next Track">⏭</button>
</div>




    <!-- Menu Acara Live -->
    <section class="live-menu">
      <h2>Acara Live</h2>
      <div class="live-controls">
        <button class="live-btn" onclick="startLive()">🔴 Live Sekarang</button>
        <button class="live-btn stop" onclick="stopLive()">⏹ Stop Live</button>
      </div>
      <p id="liveNote">Belum ada jadwal live</p>
    </section>

    <!-- User List dari API -->
    <section class="user-list">
      <h2>Daftar Users</h2>
      <ul id="users"></ul>

      <h3>Tambah User</h3>
      <input type="text" id="newUserName" placeholder="Nama user...">
      <button onclick="addUser()">Tambah</button>
    </section>
  </main>

  <!-- Sidebar kanan -->
  <aside class="sidebar">
    <!-- Pencarian -->
    <div class="search-box">
      <h2>Pencarian</h2>
      <input type="text" id="searchBox" placeholder="🔍 Cari lagu/video...">
      <div class="search-controls">
        <button class="search-btn" onclick="doSearch()">Search</button>
        <button class="reset-btn" onclick="resetSearch()">Reset</button>
      </div>
      <div id="searchResults"></div>
    </div>

    <!-- Donasi -->
    <div class="donasi-box">
      <h2>Donasi</h2>
      <p>Dukung Bossqu Media Player 🎉</p>
      <button class="donasi-btn" id="openDonasi">💰 Donasi Sekarang</button>
      <button class="donasi-btn paypal" id="openPaypal">💳 Donasi via PayPal</button>
      <button class="collapse-btn" onclick="toggleSidebar()">⬅️ Sembunyikan Donasi</button>
    </div>
  </aside>
</div>

<!-- Script API -->
<script>
  async function loadUsers() {
    const res = await fetch("/api/users");
    const data = await res.json();
    const list = document.getElementById("users");
    list.innerHTML = "";
    data.forEach(user => {
      const li = document.createElement("li");
      li.textContent = `${user.id} - ${user.name}`;
      list.appendChild(li);
    });
  }

  async function addUser() {
    const name = document.getElementById("newUserName").value;
    if (!name) return alert("Isi nama dulu!");
    const res = await fetch("/api/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    });
    await res.json();
    document.getElementById("newUserName").value = "";
    loadUsers();
  }

  // Load users saat halaman dibuka
  loadUsers();
</script>


<!-- ✅ BENER (fix error import.meta) -->
<script type="module" src="script.js"></script>

</body>
</html>
