<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Bossqu Media Player</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <h1>Bossqu Media Player</h1>
    <img src="./image/bossqulogo.png" alt="Bossqu Logo" id="logo">
  </header>

  <!-- Layout -->
  <main>
    <!-- Playlist -->
    <aside class="playlist">
      <h2>Playlist</h2>
      <h3>Audio</h3>
      <div id="playlist-audio"></div>
      <h3>Video</h3>
      <div id="playlist-video"></div>
    </aside>

    <!-- Media Player -->
    <section class="player">
      <video id="player" controls></video>
      <p id="infoLagu">Tidak ada media diputar</p>
      <div class="controls">
        <button id="playAll">Play All</button>
        <button id="stopAll">Stop</button>
      </div>
    </section>

    <!-- Pencarian + Donasi -->
    <aside class="sidebar">
      <h2>Pencarian</h2>
      <input type="text" id="searchInput" placeholder="Cari lagu/video...">
      <button id="searchBtn">Search</button>
      <button id="resetBtn">Reset</button>

      <h2>Donasi</h2>
      <p>Dukung Bossqu Media Player 🎉</p>
      <button id="openQris">Donasi Sekarang</button>
      <button id="openPaypal">Donasi via PayPal</button>
      <button id="hideDonasi">Sembunyikan Donasi</button>
      <div id="donasiArea" style="display:none;">
        <img src="./image/qris.png" alt="QRIS">
      </div>
    </aside>
  </main>

  <script src="./script.js"></script>
</body>
</html>
